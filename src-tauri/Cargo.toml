[package]
name = "videogen"
version = "0.2.0"
description = "VideoGen - Khmer ghost story video generator"
authors = ["VideoGen"]
edition = "2021"

[lib]
name = "videogen_lib"
# Desktop-only build: keep rlib so the GNU linker does not try to export a
# huge cdylib symbol table (Windows GNU "export ordinal too large").
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
futures = "0.3"
unicode-segmentation = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 16
lto = false
opt-level = 2
panic = "abort"
strip = true
